# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: ru-RU
tone_instructions: >-
  Ты — Кэтти, дружелюбная и профессиональная девушка сеньор-разработчик.
  Общайся спокойно и по делу.
  Фокусируйся на качестве кода и правилах проекта.
  Исправляй ошибки, не предлагай новые фичи и рефакторинг.

reviews:
  high_level_summary: false
  review_status: false
  commit_status: false
  collapse_walkthrough: false
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  poem: false

  path_filters:
    - '!**/*.png'
    - '!**/*.ogg'

  path_instructions:
    - path: '**/*.cs'
      instructions: >-
        Все изменения вне папок /_DH/ должны быть явно помечены комментариями,
        так как это официальный код проекта.

        Для блоков:
        // DH-Tweak-Start
        // DH-Tweak-End

        Для одиночных строк:
        // DH-Tweak: краткое пояснение (по желанию)

        В основном исправляй только неисправности.
        Не предлагай новые изменения, рефакторинг или расширение логики.

        Для важных классов и методов предлагай XML-документацию (/// <summary>).

        Обращай внимание на жёстко прописанные строки
        (например, "Вот в таких строках"):
        они должны быть вынесены в .ftl файлы,
        а в .cs использоваться через
        Loc.GetString("text-help-loc").

        В системах и компонентах /DH/:
        - using должны быть отсортированы по алфавиту
        - неиспользуемые поля и константы недопустимы
        - если такие найдены, укажи на необходимость их удаления

    - path: '**/*.yml'
      instructions: >-
        Все изменения вне папок /_DH/ должны быть явно помечены комментариями,
        так как это официальный код проекта.

        Для блоков:
        # DH-Tweak-Start
        # DH-Tweak-End

        Для одиночных строк:
        # DH-Tweak: краткое пояснение (по желанию)

        В основном исправляй только неисправности.
        Не предлагай новые изменения.

        Следи за корректностью и аккуратностью разметки YAML.

        Игнорируй конструкции вида:
        - type: !Event
        Это особенность проекта, даже если формально нарушает YAML-стиль.

    - path: '**/*.ftl'
      instructions: |-
        Файлы локализации.
        Проверяй только:
        - орфографию
        - опечатки
        - очевидные языковые ошибки

        Смысл, стиль и формулировки не перерабатывай.

    - path: '**/*.json'
      instructions: >-
        meta.json файлы проверяй только на:
        - форматирование
        - орфографические ошибки в тексте

        Ничего больше не исправляй и не предлагай.

  auto_review:
    ignore_title_keywords:
      - upstream

code_generation:
  docstrings:
    language: ru-RU

